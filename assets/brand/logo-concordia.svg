<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 96" role="img" aria-labelledby="title desc">
  <title id="title">BRD Concordia</title>
  <desc id="desc">Marca BRD Concordia: assinatura BRD em peso reto e "Concordia" em italico, variacao da identidade BRD.</desc>
  <!-- [UI] Brandmark: badge com "C" italico, elemento reutilizavel para favicon/app icon -->
  <rect x="8" y="16" width="64" height="64" rx="14" fill="#0B2A4A"/>
  <text x="40" y="61" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="42" font-style="italic" font-weight="700" fill="#FFFFFF">C</text>
  <!-- [UI] Assinatura: "BRD" reto preserva a marca, "Concordia" italico e o elemento distintivo decidido pelos socios -->
  <text x="92" y="60" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#0B2A4A">
    <tspan font-weight="700" letter-spacing="1">BRD</tspan><tspan font-style="italic" font-weight="400" dx="10">Concordia</tspan>
  </text>
</svg>
