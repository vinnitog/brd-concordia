<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">BRD Concordia</title>
  <desc id="desc">Simbolo quadrado para favicon e icone de app: badge com "C" italico.</desc>
  <!-- [UI] Favicon/app icon: brandmark quadrado derivado da marca principal -->
  <rect width="64" height="64" rx="14" fill="#0B2A4A"/>
  <text x="32" y="45" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="42" font-style="italic" font-weight="700" fill="#FFFFFF">C</text>
</svg>
