<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 96" role="img" aria-labelledby="title desc">
  <title id="title">BRD Concordia (monocromatico)</title>
  <desc id="desc">Versao monocromatica em cor unica (currentColor) para impressao, carimbo e fundos claros.</desc>
  <!-- [UI] Monocromatica: usa currentColor para impressao em uma cor e aplicacoes de baixa fidelidade -->
  <rect x="8" y="16" width="64" height="64" rx="14" fill="none" stroke="currentColor" stroke-width="4" color="#0B2A4A"/>
  <text x="40" y="61" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="42" font-style="italic" font-weight="700" fill="currentColor" color="#0B2A4A">C</text>
  <text x="92" y="60" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="currentColor" color="#0B2A4A">
    <tspan font-weight="700" letter-spacing="1">BRD</tspan><tspan font-style="italic" font-weight="400" dx="10">Concordia</tspan>
  </text>
</svg>
