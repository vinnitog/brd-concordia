name: Validate private utilities access
on:
  push:
    branches: [ci/techtogs-private-auth-20261007, ci/techtogs-private-auth-current-20261007, develop, main]
    paths: ['.github/workflows/**', '.techtogs-utilities.json', 'scripts/bootstrap-utilities.ps1']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-utilities:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Selecionar versao fixada no manifesto
        id: utilities-pin
        run: node -e 'const fs=require("fs"); const m=JSON.parse(fs.readFileSync(".techtogs-utilities.json","utf8")); if(!/^[a-f0-9]{40}$/.test(m.libraryCommit)) throw Error("Invalid utilities commit"); fs.appendFileSync(process.env.GITHUB_OUTPUT,"ref="+m.libraryCommit+"\n");'
      - name: Baixar implementacao da action privada
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: vinnitog/techtogs-utilities
          ref: ${{ steps.utilities-pin.outputs.ref }}
          ssh-key: ${{ secrets.TECHTOGS_UTILITIES_SSH_KEY }}
          persist-credentials: false
          path: ._techtogs_action
      - name: Preparar consumidor isolado
        id: fixture
        env:
          SMOKE_INCLUDE_SENIOR: 'true'
        run: node ._techtogs_action/scripts/ci-auth-smoke.mjs prepare "${{ steps.utilities-pin.outputs.ref }}"
      - name: Instalar skills e agents privados
        uses: ./._techtogs_action
        with:
          ssh-key: ${{ secrets.TECHTOGS_UTILITIES_SSH_KEY }}
          project-path: ${{ steps.fixture.outputs.project }}
      - name: Verificar commit, credenciais e reversao
        env:
          SMOKE_PROJECT: ${{ steps.fixture.outputs.project }}
        run: node ._techtogs_action/scripts/ci-auth-smoke.mjs verify

      - name: Instalar manifesto completo deste consumidor
        uses: ./._techtogs_action
        env:
          TECHTOGS_UTILITIES_PATH: ''
        with:
          ssh-key: ${{ secrets.TECHTOGS_UTILITIES_SSH_KEY }}
      - name: Verificar manifesto completo e idempotencia
        shell: bash
        run: |
          set -euo pipefail
          node "$TECHTOGS_UTILITIES_PATH/scripts/utilities.mjs" verify --project "$GITHUB_WORKSPACE"
          node "$TECHTOGS_UTILITIES_PATH/scripts/utilities.mjs" install --project "$GITHUB_WORKSPACE"
