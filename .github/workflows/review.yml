name: BRD review

# Fase 3 (code review consultivo): delega ao reusable do brd-ci. So em PR contra
# develop. `opened`/`reopened` apenas - nao em cada push (synchronize) para nao
# gastar token a cada commit do PR.
on:
  pull_request:
    types: [opened, reopened]
    branches: [develop]

# O reusable de review pede pull-requests: write (comentar). Elevar aqui
# porque o default do repo e read e o reusable nao pode exceder o caller.
permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: vinnitog/brd-ci/.github/workflows/review.yml@main
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TECHTOGS_UTILITIES_SSH_KEY: ${{ secrets.TECHTOGS_UTILITIES_SSH_KEY }}
